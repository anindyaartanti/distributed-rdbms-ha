global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 3

frontend stats_frontend
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s

frontend write_a
    bind *:3306
    default_backend master_a

frontend read_a
    bind *:3307
    default_backend replicas_a

frontend write_b
    bind *:3316
    default_backend master_b

frontend read_b
    bind *:3317
    default_backend replicas_b

backend master_a
    mode tcp
    option mysql-check user haproxy_check
    server shard-a-master shard-a-master:3306 check

backend replicas_a
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check
    server shard-a-rep1 shard-a-rep1:3306 check
    server shard-a-rep2 shard-a-rep2:3306 check

backend master_b
    mode tcp
    option mysql-check user haproxy_check
    server shard-b-master shard-b-master:3306 check

backend replicas_b
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check
    server shard-b-rep1 shard-b-rep1:3306 check
    server shard-b-rep2 shard-b-rep2:3306 check
